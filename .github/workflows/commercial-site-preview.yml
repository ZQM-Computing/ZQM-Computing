name: Computing commercial preview SEO

on:
  pull_request:
    paths:
      - 'commercial-site/**'
      - '.github/workflows/commercial-site-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Hugo
        run: |
          sudo apt-get update
          sudo apt-get install -y hugo
          hugo version
      - name: Test public release validator against synthetic fixtures
        run: node --test commercial-site/scripts/verify-release.test.cjs
      - name: Validate isolated synthetic public render without deploying
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/computing-public-fixture"
          cp -a commercial-site "$fixture"
          sed -i 's#https://example.invalid/#https://gis.example.org/#' "$fixture/hugo.toml"
          sed -i 's/publicRelease = false/publicRelease = true/' "$fixture/hugo.toml"
          grep -q 'publicRelease = true' "$fixture/hugo.toml"
          hugo --source "$fixture" --destination public --minify
          node commercial-site/scripts/verify-release.cjs "$fixture/public" https://gis.example.org
          test "$(grep -c 'publicRelease = false' commercial-site/hugo.toml)" -eq 1
          grep -q 'https://example.invalid/' commercial-site/hugo.toml
      - name: Render Computing preview without publishing
        run: hugo --source commercial-site --destination public --minify
      - name: Ensure preview remains excluded from search indexing
        run: node commercial-site/scripts/verify-preview.cjs commercial-site/public
